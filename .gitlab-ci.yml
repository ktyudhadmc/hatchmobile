# # Android build-only pipeline (no Play Store publishing yet).
# #
# # Versioning:
# #   - Stable release:  tag  vMAJOR.MINOR.PATCH            e.g. v1.2.3
# #   - Testing build:   tag  vMAJOR.MINOR.PATCH-rc.N        e.g. v1.2.3-rc.1
# #                       (also accepts -beta.N / -snapshot.N, same rules)
# #   The tag (minus the leading "v") becomes the APK's versionName.
# #   CI_PIPELINE_IID (an auto-incrementing per-project counter) becomes the
# #   versionCode, so every build - stable or pre-release - has a strictly
# #   increasing build number as Android requires.
# #
# # Requires the following GitLab Secure Files (Settings > CI/CD > Secure
# # Files); the download-secure-files tool below fetches them into
# # .secure_files/ during the build job:
# #   - google-services.json     per-environment Firebase config
# #   - upload-keystore.jks      release signing keystore
# # Signing also needs these masked CI/CD variables (Settings > CI/CD >
# # Variables): KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS.
# #
# # In-app update (lib/features/app_update/) reads this project's Releases API
# # with no auth — it's public with Releases set to "Everyone With Access".

# stages:
#   - analyze
#   - test
#   - build
#   - release

