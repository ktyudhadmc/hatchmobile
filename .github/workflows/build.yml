# Android build-only pipeline (no Play Store publishing yet).
#
# Versioning:
#   - Stable release:  tag  vMAJOR.MINOR.PATCH            e.g. v1.2.3
#   - Testing build:   tag  vMAJOR.MINOR.PATCH-rc.N        e.g. v1.2.3-rc.1
#                       (also accepts -alpha.N / -beta.N / -snapshot.N, same
#                       rules — alpha for internal-device testing, beta for
#                       wider testers, rc for release-candidate, snapshot for
#                       ad-hoc builds off a branch)
#   The tag (minus the leading "v") becomes the APK's versionName.
#   GITHUB_RUN_NUMBER (an auto-incrementing per-workflow counter) becomes the
#   versionCode, so every build - stable or pre-release - has a strictly
#   increasing build number as Android requires.
#
# Requires the following GitHub Actions secrets (Settings > Secrets and
# variables > Actions):
#   - GOOGLE_SERVICES_JSON        base64-encoded per-environment Firebase config
#   - UPLOAD_KEYSTORE_JKS         base64-encoded release signing keystore
#   - KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS    signing credentials
#   - FIREBASE_ANDROID_APP_ID     Firebase console > Project settings > this
#                                 Android app's "App ID" (1:...:android:...)
#   - FIREBASE_SERVICE_ACCOUNT_JSON   base64-encoded service account key
#                                 (role: Firebase App Distribution Admin) —
#                                 used only to push pre-release builds to
#                                 Firebase App Distribution testers
#
# In-app update (lib/features/app_update/) reads this repo's Releases API
# with no auth — it's public.
#
# Pre-release tags (alpha/beta/rc/snapshot) additionally get pushed to
# Firebase App Distribution testers (see the `distribute` job) — alpha goes
# to the "alpha-testers" tester group, everything else pre-release to
# "beta-testers". Both groups must already exist in the Firebase console
# (App Distribution > Testers & Groups). A stable tag skips this and only
# goes out via the GitHub Release + in-app updater, as before.

name: build

on:
  pull_request:
  push:
    branches:
      - develop
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-snapshot.[0-9]+"

# Pin an exact Flutter version for reproducible builds; bump deliberately.
env:
  FLUTTER_VERSION: "3.35.5"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test

  # Ad-hoc APK for a pull request / branch push, not versioned by a tag.
  # Useful to grab a build for manual testing without cutting a release tag.
  build-dev:
    if: github.ref_type != 'tag'
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Set up signing and Firebase config
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          echo "${{ secrets.UPLOAD_KEYSTORE_JKS }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: |
          VERSION="0.0.0-dev"
          echo "Building $VERSION (build ${{ github.run_number }})"
          # arm64-v8a only: every device this app targets (2018+) is arm64,
          # and a single ABI keeps the installed APK roughly a third the
          # size of a universal build (no armeabi-v7a/x86_64 native libs).
          # Also keeps the in-app updater's "pick the first .apk asset"
          # logic (AppUpdateModel) valid — it assumes exactly one APK per
          # release, so don't switch this to --split-per-abi without also
          # teaching that logic to pick the right split for the device.
          flutter build apk --release --target-platform android-arm64 --build-name="$VERSION" --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "app-release-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hatchmobile-dev
          path: app-release-*.apk
          retention-days: 14

  # Tagged build: vX.Y.Z (stable) or vX.Y.Z-alpha.N / -rc.N / -beta.N / -snapshot.N (testing).
  build-tag:
    if: github.ref_type == 'tag'
    needs: [analyze, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Set up signing and Firebase config
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          echo "${{ secrets.UPLOAD_KEYSTORE_JKS }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building $VERSION (build ${{ github.run_number }})"
          # arm64-v8a only — see the build-dev job above for why.
          flutter build apk --release --target-platform android-arm64 --build-name="$VERSION" --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk "app-release-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-release-${VERSION}.apk" >> "$GITHUB_OUTPUT"

          # Same channel parsing as DeviceInfoHelper.buildChannel in the app
          # itself — keep the two in sync if the tag suffixes ever change.
          CHANNEL="stable"
          case "$VERSION" in
            *-alpha.*) CHANNEL="alpha" ;;
            *-beta.*) CHANNEL="beta" ;;
            *-rc.*) CHANNEL="rc" ;;
            *-snapshot.*) CHANNEL="snapshot" ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hatchmobile-${{ steps.version.outputs.version }}
          path: app-release-*.apk
          retention-days: 0

  # Publishes the tagged APK as a GitHub Release asset.
  release:
    needs: build-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hatchmobile-${{ needs.build-tag.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hatchmobile ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ needs.build-tag.outputs.apk_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-snapshot.') }}

  # Pushes pre-release builds straight to Firebase App Distribution testers
  # — alpha to the internal-device group (alpha-testers), everything else
  # pre-release to the wider group (beta-testers). A stable tag is skipped
  # here entirely.
  distribute:
    needs: build-tag
    if: needs.build-tag.outputs.channel != 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hatchmobile-${{ needs.build-tag.outputs.version }}

      - name: Set up Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > firebase-service-account.json

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFile: firebase-service-account.json
          groups: ${{ needs.build-tag.outputs.channel == 'alpha' && 'alpha-testers' || 'beta-testers' }}
          file: ${{ needs.build-tag.outputs.apk_name }}
          releaseNotes: "hatchmobile ${{ github.ref_name }} (${{ needs.build-tag.outputs.channel }})"
