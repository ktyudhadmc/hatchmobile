name: hatchmobile
description: "Hatchery Mobile"
publish_to: "none"
# Local/dev version only. Released builds get their versionName/versionCode
# from the git tag via `flutter build --build-name/--build-number` in CI
# (see .gitlab-ci.yml), which overrides this value — bump it whenever, it
# has no effect on what ships.
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase (each product is wrapped behind a module in lib/core/firebase)
  firebase_core: ^4.3.0
  firebase_analytics: ^12.3.0
  firebase_remote_config: ^6.6.0
  firebase_messaging: ^16.1.0

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # Routing
  go_router: ^17.0.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # Device / app info (used for API request headers)
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

  # In-app update: download the release APK and hand it to the OS installer.
  path_provider: ^2.1.5
  open_filex: ^4.7.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  toastification: ^3.0.3
  uuid: ^4.5.2
  flutter_svg: ^2.2.3

  # QR / barcode scanning
  mobile_scanner: ^7.4.2

  # PIN input fields
  pin_code_fields: ^8.0.1
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true
