# # Android build-only pipeline (no Play Store publishing yet).
# #
# # Versioning:
# #   - Stable release:  tag  vMAJOR.MINOR.PATCH            e.g. v1.2.3
# #   - Testing build:   tag  vMAJOR.MINOR.PATCH-rc.N        e.g. v1.2.3-rc.1
# #                       (also accepts -beta.N / -snapshot.N, same rules)
# #   The tag (minus the leading "v") becomes the APK's versionName.
# #   GITHUB_RUN_NUMBER (an auto-incrementing per-workflow counter) becomes the
# #   versionCode, so every build - stable or pre-release - has a strictly
# #   increasing build number as Android requires.
# #
# # Requires the following GitHub Actions secrets (Settings > Secrets and
# # variables > Actions):
# #   - GOOGLE_SERVICES_JSON     base64-encoded per-environment Firebase config
# #   - UPLOAD_KEYSTORE_JKS      base64-encoded release signing keystore
# #   - KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS    signing credentials
# #
# # In-app update (lib/features/app_update/) reads this repo's Releases API
# # with no auth — it's public.

